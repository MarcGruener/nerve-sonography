# https://nerve-sonography.org is the one canonical host. Google listed the site
# under www while it was on Vercel, so www answers 301 to the apex, keeping the
# path, for at least a year (I2 in moonlighting-infra). Traefik terminates TLS in
# front, so nginx sees plain HTTP and the target's scheme is written out.
server {
  listen 8080;
  server_name www.nerve-sonography.org;
  server_tokens off;
  return 301 https://nerve-sonography.org$request_uri;
}

# site/, for every other host: the canonical one, and the healthcheck's 127.0.0.1.
# The page still loads Tailwind, model-viewer and Mermaid from their CDNs, so those
# three hosts are allowed next to Plausible's; they go once the files are served
# from here. Its two inline scripts and three event handlers are allowed by hash,
# and csp-check.mjs fails the build when a page carries any other. Tailwind's CDN
# writes its styles into a <style> tag, so inline styles are allowed.
server {
  listen 8080 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;
  # Traefik terminates TLS in front, so a redirect must not name this server's scheme or port.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml model/gltf+json application/manifest+json;

  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-YHh9sC28qIMf3+6W4oDjkjbYzddu3r6gVCU30hm6h5w=' 'sha256-G0HQ1oxrNgxUkTNZB3kz+hH9UiriF68iygoanNaDoJI=' 'sha256-V05m34cCzZvFxwYyqYwHp6ZuVKeC/LRAMINkbcejC8U=' 'sha256-cA4cCTKm6p5y9gXr0okLq5n7rzQqz/2cAFBMvAGskGI=' 'sha256-g/iLHGc5iihy1/TbAjeE3gtrBsOwVXBchPv3dLbNlmY=' https://cdn.tailwindcss.com https://ajax.googleapis.com https://cdnjs.cloudflare.com https://plausible.moonlighting.dev; connect-src 'self' https://plausible.moonlighting.dev https://openpanel.moonlighting.dev; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  error_page 404 /404.html;

  # The index module answers / with index.html. Anywhere else only a file answers,
  # so a folder's address is a 404 rather than a 403.
  location = / {
    expires 10m;
  }

  location / {
    try_files $uri =404;
    expires 10m;
  }

  # Images, the video and the 3D model change only with a new file name.
  location /staticfiles/ {
    try_files $uri =404;
    expires 1d;
  }

  # nginx's type map knows neither, and nosniff makes the type count.
  location ~ \.gltf$ {
    types { }
    default_type model/gltf+json;
    expires 1d;
  }

  location = /site.webmanifest {
    types { }
    default_type application/manifest+json;
    expires 10m;
  }
}
